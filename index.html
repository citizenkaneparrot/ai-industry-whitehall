<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The AI industry in Whitehall</title>
<style>
  :root {
    --bg:#ffffff; --panel:#f6f7f9; --border:#d8dce3; --text:#14181f;
    --muted:#5b6472; --accent:#1d4ed8; --bad:#a3282d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1319; --panel:#171c25; --border:#2a323f; --text:#e7ebf2;
      --muted:#98a2b3; --accent:#7aa2ff; --bad:#f28b8b;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1319; --panel:#171c25; --border:#2a323f; --text:#e7ebf2;
    --muted:#98a2b3; --accent:#7aa2ff; --bad:#f28b8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .gate { width: min(420px, calc(100vw - 40px)); padding: 28px; }
  .mark { font-size: 30px; color: var(--accent); line-height: 1; }
  h1 { font-size: 20px; margin: 14px 0 6px; text-wrap: balance; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  label { font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  input {
    padding: 11px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    padding: 11px 12px; font-size: 15px; font-weight: 600; border: 0;
    border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button[disabled] { opacity: .6; cursor: progress; }
  .msg { min-height: 20px; font-size: 13.5px; color: var(--bad); }
</style>
</head>
